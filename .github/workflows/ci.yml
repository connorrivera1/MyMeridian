# Continuous integration for Meridian.
#
# NOTE: this repository has no git remote as of 2026-08-09, so nothing runs
# this file yet. It is committed ready for the day one is added. The gate that
# actually protects `main` today is the pre-commit hook in `.githooks/` — see
# the "Guarding main" section of README.md.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the engines field in package.json and the Dockerfile's
          # NODE_VERSION. Drift here is a real failure mode: the build runs
          # Prisma's engine, which is version-sensitive.
          node-version: "22.14.0"
          cache: npm

      - name: Install
        run: npm ci

      # Explicit rather than relying on the build to do it: a stale client is a
      # confusing failure, and `prisma generate` is cheap.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage thresholds
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # Migrations have never been applied to a production database, so the
      # deploy's release_command is the first thing that would ever run them.
      # This proves they still apply cleanly to an empty database on every
      # change, rather than finding out during a deploy.
      - name: Migrations apply cleanly from empty
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/meridian_ci
        run: |
          npx prisma migrate deploy
          npx prisma migrate diff \
            --from-schema-datasource prisma/schema.prisma \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: meridian_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
      - run: npm ci
      # High and critical only. Moderate advisories in dev tooling would make
      # this noisy enough to be ignored, which is worse than not having it.
      - name: Dependency audit
        run: npm audit --audit-level=high
