# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

name = "Meridian"
handle = "meridian-profit"
# NOT SUBMITTABLE AS IT STANDS. This is still the Shopify CLI's placeholder.
# It must become the app's real, stable, public HTTPS origin before submission:
# Shopify rejects localhost and tunnel URLs here, and it must not contain the
# words "Shopify" or "Example". Every webhook `uri` below is relative and
# resolves against this value, so until it is real all three mandatory
# compliance webhooks resolve to a host Shopify cannot deliver to.
#
# `automatically_update_urls_on_dev = true` rewrites this and redirect_urls to
# the tunnel while `shopify app dev` runs, which is why it can sit wrong for a
# long time without anything locally appearing to break.
#
# TODO(deploy): no production deployment target is configured anywhere in this
# repo yet, so this cannot be filled in automatically. Checked: .env /
# .env.example (SHOPIFY_APP_URL is "http://localhost:3000", dev-only), .shopify/
# (CLI project link only, no host), package.json (no deploy script/target), and
# no wrangler.toml / fly.toml / vercel.json anywhere in the tree. There is also
# no git remote configured. SUBMISSION.md independently flags this exact gap as
# Blocker #1. Once a real host exists, set application_url to that origin and
# update redirect_urls below to match — webhook `uri` values are relative and
# resolve against this automatically.
#
# DEPLOY_PLAN.md now carries the rest of it: Fly.io as the host and why a
# serverless one would silently truncate every store's first import, the
# Dockerfile and fly.toml to deploy with, and the exact command sequence.
# Two things there are easy to get wrong from this file alone:
#
#   - `shopify app config push` no longer exists on @shopify/cli 4.x. Config
#     reaches the Partner Dashboard through `shopify app deploy`, which carries
#     it because [build] include_config_on_deploy is true below.
#   - set automatically_update_urls_on_dev = false at the same time as filling
#     this in. While it is true, one later `shopify app dev` rewrites this line
#     and redirect_urls to a tunnel that stops existing when the session ends.
application_url = "https://shopify.dev/apps/default-app-home"
embedded = true
client_id = "9dfbe484752628b0a96c4755caf4f502"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
#
# read_inventory is what exposes InventoryItem.unitCost — the cost of goods
# behind every margin in the app. Without it COGS is zero and every profit
# figure is overstated. It is NOT protected customer data, so it does not need
# a Partner Dashboard request; if it turns out to cause trouble, dropping it is
# safe and the app will say so rather than report inflated margins.
#
# read_customers is deliberately NOT here. It is protected customer data and
# needs an approved request (Partner Dashboard -> App -> API access). Without
# it there is no CAC, lifetime value, payback, or loss-leader detection — the
# Acquisition screen explains this rather than showing zeroes.
#
# read_refunds is deliberately absent: it is not a Shopify access scope, and
# refunds are read as Order.refunds inside the orders query, which read_orders
# already covers. Requesting a scope the platform does not recognise risks
# failing OAuth outright, and nothing in the app ever checked for it.
scopes = "read_orders read_products read_fulfillments read_inventory"

[auth]
# The path has to match `authPathPrefix` in app/shopify.server.ts, which is
# "/auth" — so the callback the library actually serves is /auth/callback. This
# said /api/auth, which is the Remix template's default and a route that does
# not exist in this app; OAuth would have failed on the redirect. The host is
# still the placeholder from application_url above and changes with it.
redirect_urls = [ "https://shopify.dev/apps/default-app-home/auth/callback" ]

[webhooks]
# Pinned to the version @shopify/shopify-api 13.1.0 actually models. Leaving
# this ahead of the library means webhook payloads arrive in a shape its types
# do not describe.
api_version = "2026-07"

# The three mandatory privacy compliance webhooks. A public app cannot pass
# review without all three. Relative URIs resolve against application_url, so
# they track dev-tunnel and production URLs automatically — no hardcoded host,
# which is why the old [webhooks.privacy_compliance] absolute-URL block kept
# breaking on dev machines. Handlers verify HMAC via authenticate.webhook and
# return 401 on a bad signature, as Shopify's automated review requires.

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request" ]
  uri = "/webhooks/gdpr/customers-data-request"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/redact" ]
  uri = "/webhooks/gdpr/customers-redact"

  [[webhooks.subscriptions]]
  compliance_topics = [ "shop/redact" ]
  uri = "/webhooks/gdpr/shop-redact"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  # Under managed installation a merchant can grant or revoke an optional scope
  # without reinstalling, and this is the only notification of it. Without it
  # Shop.grantedScopes stays at whatever install recorded, and the import gates
  # its GraphQL fields on that record.
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes-update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/create"
  topics = [ "orders/create", "orders/updated", "refunds/create" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/products/update"
  topics = [ "products/update", "products/create" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/fulfillments/create"
  topics = [ "fulfillments/create", "fulfillments/update" ]

  # Billing API charges, created by the app from the PLANS in
  # app/shopify.server.ts. This topic is still delivered for Billing API
  # subscriptions; Shopify App Pricing stopped sending it on 28 April 2026,
  # which is one of the reasons Meridian does not use App Pricing — see
  # app/lib/plan.server.ts.
  [[webhooks.subscriptions]]
  uri = "/webhooks/app-subscriptions/update"
  topics = [ "app_subscriptions/update" ]

[pos]
embedded = false

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
