# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

name = "Meridian"
handle = "meridian-profit"
application_url = "https://shopify.dev/apps/default-app-home"
embedded = true
client_id = "9dfbe484752628b0a96c4755caf4f502"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
#
# read_inventory is what exposes InventoryItem.unitCost — the cost of goods
# behind every margin in the app. Without it COGS is zero and every profit
# figure is overstated. It is NOT protected customer data, so it does not need
# a Partner Dashboard request; if it turns out to cause trouble, dropping it is
# safe and the app will say so rather than report inflated margins.
#
# read_customers is deliberately NOT here. It is protected customer data and
# needs an approved request (Partner Dashboard -> App -> API access). Without
# it there is no CAC, lifetime value, payback, or loss-leader detection — the
# Acquisition screen explains this rather than showing zeroes.
scopes = "read_orders read_products read_fulfillments read_refunds read_inventory"

[auth]
redirect_urls = [ "https://shopify.dev/apps/default-app-home/api/auth" ]

[webhooks]
# Pinned to the version @shopify/shopify-api 13.1.0 actually models. Leaving
# this ahead of the library means webhook payloads arrive in a shape its types
# do not describe.
api_version = "2026-07"

# The three mandatory privacy compliance webhooks. A public app cannot pass
# review without all three. Relative URIs resolve against application_url, so
# they track dev-tunnel and production URLs automatically — no hardcoded host,
# which is why the old [webhooks.privacy_compliance] absolute-URL block kept
# breaking on dev machines. Handlers verify HMAC via authenticate.webhook and
# return 401 on a bad signature, as Shopify's automated review requires.

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request" ]
  uri = "/webhooks/gdpr/customers-data-request"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/redact" ]
  uri = "/webhooks/gdpr/customers-redact"

  [[webhooks.subscriptions]]
  compliance_topics = [ "shop/redact" ]
  uri = "/webhooks/gdpr/shop-redact"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/create"
  topics = [ "orders/create", "orders/updated", "refunds/create" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/products/update"
  topics = [ "products/update", "products/create" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/fulfillments/create"
  topics = [ "fulfillments/create", "fulfillments/update" ]

  # Managed pricing: the merchant picks a plan on Shopify's billing screen and
  # this webhook is how the app finds out. Plan names in the Partner Dashboard
  # must match the PLANS in app/shopify.server.ts.
  [[webhooks.subscriptions]]
  uri = "/webhooks/app-subscriptions/update"
  topics = [ "app_subscriptions/update" ]

[pos]
embedded = false

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
