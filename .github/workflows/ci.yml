# Continuous integration for MyMeridian.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          # Matches the engines field in package.json and the Dockerfile's
          # NODE_VERSION. Drift here is a real failure mode: the build runs
          # Prisma's engine, which is version-sensitive.
          node-version: "22.14.0"
          cache: npm

      - name: Install
        run: npm ci

      # Explicit rather than relying on the build to do it: a stale client is a
      # confusing failure, and `prisma generate` is cheap.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      # Deliberately before the integration tests: they need this schema, and
      # DATABASE_URL is scoped to this step so the unit suite above still runs
      # with no database at all — that skip path is what every developer
      # without one relies on, and it should be exercised here too.
      #
      # This proves they still apply cleanly to an empty database on every
      # change, rather than finding out during a deploy.
      - name: Migrations apply cleanly from empty
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/meridian_ci
        run: |
          npx prisma migrate deploy
          npx prisma migrate diff \
            --from-schema-datasource prisma/schema.prisma \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code

      - name: Test with coverage thresholds
        run: npm run test:coverage

      # Concurrency and SQL-NULL semantics are invisible through mocked Prisma:
      # backfill claims, order/product advisory locks, transaction rollback and
      # durable webhook lease/payload erasure all need a real server.
      - name: Integration tests against a real Postgres
        env:
          MERIDIAN_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/meridian_ci
        run: >-
          npx vitest run
          app/integrations/ad-health.integration.test.ts
          app/lib/backfill-claim.integration.test.ts
          app/lib/checkout-usage.integration.test.ts
          app/lib/cost-restatement.integration.test.ts
          app/lib/data-request.integration.test.ts
          app/lib/order-lock.integration.test.ts
          app/lib/product-sync.integration.test.ts
          app/lib/economic-ingestion.integration.test.ts
          app/lib/recompute.integration.test.ts
          app/lib/webhooks.integration.test.ts

      - name: Build
        run: npm run build

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: meridian_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.14.0"
          cache: npm
      - run: npm ci
      # High and critical only. Moderate advisories in dev tooling would make
      # this noisy enough to be ignored, which is worse than not having it.
      - name: Dependency audit
        run: npm audit --audit-level=high
