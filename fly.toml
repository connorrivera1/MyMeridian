# Internal production app slug. The shorter global Fly slug was unavailable;
# the public origin remains https://mymeridian.io.
app = "mymeridian-prod"
primary_region = "iad"

[build]

[env]
  NODE_ENV = "production"
  PORT = "8080"
  SHOPIFY_APP_URL = "https://mymeridian.io"
  SCOPES = "read_orders,read_all_orders,read_products,read_fulfillments,read_inventory,read_reports"
  MERIDIAN_SUPPORT_EMAIL = "support@mymeridian.io"
  MERIDIAN_SUPPORT_URL = "https://mymeridian.io/support"
  MERIDIAN_EMAIL_FROM = "MyMeridian <welcome@mymeridian.io>"
  MERIDIAN_PUBLIC_ORIGIN = "https://mymeridian.io"
  # Meta, Google Ads and TikTok are launch commitments. /readyz refuses to
  # report production-ready until their exact global OAuth/API credentials are
  # present; merchant authorizations are still stored separately and encrypted.
  MERIDIAN_REQUIRE_LAUNCH_CONNECTORS = "true"
  # Browser-based Google and Microsoft sign-in are launch commitments too;
  # readiness rejects a production machine that lacks their web OAuth keys.
  MERIDIAN_REQUIRE_WEB_OAUTH = "true"
  # A launch connector needs its durable worker active. Readiness also refuses
  # a secret override to true, so an exhausted staging queue cannot silently
  # become the production behavior.
  MERIDIAN_ADS_WORKER_DISABLED = "false"
  # app/lib/auth.server.ts throws at boot if this is "true" while
  # NODE_ENV=production. That is deliberate — the demo path bypasses Shopify
  # session authentication — so this is not an optional line.
  MERIDIAN_DEMO_MODE = "false"

[deploy]
  # Runs on a temporary machine before the new version takes traffic. The
  # complete checked-in migration set is applied to a production database.
  # fly mpg attach gives runtime DATABASE_URL the pooled PgBouncer endpoint.
  # Prisma Migrate needs a direct session, so only this release process swaps
  # the separately configured direct URL into the name Prisma reads.
  release_command = "/bin/sh -lc 'DATABASE_URL=$DIRECT_DATABASE_URL npx prisma migrate deploy'"

[http_service]
  internal_port = 8080
  force_https = true

  # afterAuth persists the historical job before returning, then wakes the
  # leased Postgres worker. A machine that suspends when the request queue drains
  # pauses progress; the durable cursor/lease makes restart recovery automatic,
  # but an always-on worker is still required for uninterrupted completion.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    # Liveness is deliberately independent from Shopify and Postgres. `/readyz`
    # remains available for deploy smoke tests that need database/config proof.
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  cpu_kind = "shared"
  # Initial measured baseline selected in DEPLOYMENT_RUNBOOK.md. Deploying it
  # is a paid action and still requires Connor's explicit authorization.
  cpus = 2
  memory_mb = 2048
