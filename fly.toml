app = "meridian-profit"
primary_region = "iad"

[build]

[env]
  NODE_ENV = "production"
  PORT = "8080"
  # app/lib/auth.server.ts throws at boot if this is "true" while
  # NODE_ENV=production. That is deliberate — the demo path bypasses Shopify
  # session authentication — so this is not an optional line.
  MERIDIAN_DEMO_MODE = "false"

[deploy]
  # Runs on a temporary machine before the new version takes traffic. There are
  # 33 migrations in prisma/migrations, none applied to a production database.
  # fly mpg attach gives runtime DATABASE_URL the pooled PgBouncer endpoint.
  # Prisma Migrate needs a direct session, so only this release process swaps
  # the separately configured direct URL into the name Prisma reads.
  release_command = "/bin/sh -lc 'DATABASE_URL=$DIRECT_DATABASE_URL npx prisma migrate deploy'"

[http_service]
  internal_port = 8080
  force_https = true

  # afterAuth persists the historical job before returning, then wakes the
  # leased Postgres worker. A machine that suspends when the request queue drains
  # pauses progress; the durable cursor/lease makes restart recovery automatic,
  # but an always-on worker is still required for uninterrupted completion.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    # Liveness is deliberately independent from Shopify and Postgres. `/readyz`
    # remains available for deploy smoke tests that need database/config proof.
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
