[extend]
useDefault = true

[[allowlists]]
description = "Empty and explicit placeholder assignments in the example environment file"
paths = ['''^\.env\.example$''']
regexTarget = "line"
regexes = ['''^[A-Z][A-Z0-9_]*=(?:""|"replace_me"|)$''']

[[allowlists]]
description = "Public RFC 6238 TOTP test vector, never a deployed secret"
paths = ['''^app/lib/operator-(?:totp\.test|auth\.integration\.test)\.ts$''']
regexTarget = "line"
regexes = ['''GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ''']
